services:
  postgres:
    image: postgres:16
    container_name: luxeverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luxeverse
    ports:
      - "5432:5432"
    volumes:
      - luxeverse_postgres_data:/var/lib/postgresql/data

volumes:
  luxeverse_postgres_data:
